<!DOCTYPE html>
<html lang="en" class="h-full bg-review-bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi review</title>
<style>__STYLES__</style>
<style>
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .scrollbar-thin::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  .scrollbar-thin::-webkit-scrollbar-thumb {
    background: var(--color-review-border, #30363d);
    border-radius: 999px;
    border: 3px solid var(--color-review-panel, #161b22);
  }

  .scrollbar-thin::-webkit-scrollbar-track {
    background: transparent;
  }

  .review-modal-backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--color-review-bg, #010409) 86%, transparent);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .review-modal-card {
    width: min(760px, 92vw);
    background: var(--color-review-panel, #161b22);
    border: 1px solid var(--color-review-border, #30363d);
    border-radius: 12px;
    box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
    padding: 24px;
  }

  #code-view {
    height: 100%;
    overflow: auto;
  }

  .review-comment {
    padding: 10px 16px 12px 16px;
    background: var(--color-review-panel, #161b22);
    border-top: 1px solid var(--color-review-border, #30363d);
    border-bottom: 1px solid var(--color-review-border, #30363d);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
</style>
</head>
<body class="h-full overflow-hidden bg-review-bg text-review-text antialiased">
<div id="root-layout" class="flex h-full w-full flex-col">
  <div class="flex items-center justify-between gap-4 border-b border-review-border bg-review-bg px-4 py-3">
    <div class="min-w-0 flex items-center gap-3">
      <button id="toggle-sidebar-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Hide sidebar</button>
      <div class="min-w-0">
        <div id="window-title" class="text-[15px] font-semibold text-review-strong">Review</div>
        <div id="repo-root" class="truncate text-[11px] text-review-muted"></div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="summary" class="max-w-[24rem] truncate text-[11px] text-review-muted"></div>
      <button id="toggle-style-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Split view</button>
      <button id="toggle-wrap-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Wrap: on</button>
      <button id="toggle-unchanged-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Show full files</button>
      <button id="undo-button" class="hidden cursor-pointer rounded-md border border-review-error/40 bg-review-panel px-3 py-1.5 text-xs font-medium text-review-error hover:bg-review-error/10">Undo turn</button>
      <button id="overall-comment-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Overall note</button>
      <button id="cancel-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-error/10 hover:text-review-error hover:border-review-error/30">Cancel</button>
      <button id="submit-button" class="cursor-pointer rounded-md border border-review-border bg-review-success px-3 py-1.5 text-xs font-medium text-white hover:opacity-90">Finish review</button>
    </div>
  </div>

  <div id="content-layout" class="flex min-h-0 flex-1">
    <aside id="sidebar" class="flex min-h-0 shrink-0 flex-col border-r border-review-border bg-review-bg" style="width: 280px; min-width: 280px; flex-basis: 280px; overflow: hidden;">
      <div class="border-b border-review-border px-4 py-3">
        <div class="mb-2 flex items-center justify-between gap-2">
          <div id="sidebar-title" class="text-[11px] font-semibold uppercase tracking-wider text-review-muted">Files</div>
          <div class="text-[10px] text-review-muted">j / k to move</div>
        </div>
        <input id="sidebar-search-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search files" class="w-full rounded-md border border-review-border bg-review-panel px-3 py-2 text-sm text-review-text outline-none placeholder:text-review-muted focus:border-review-accent focus:ring-1 focus:ring-review-accent">
      </div>
      <div id="file-tree" class="scrollbar-thin min-h-0 flex-1 overflow-auto px-2 pb-2"></div>
      <div id="mode-hint" class="border-t border-review-border px-4 py-2 text-[11px] text-review-muted"></div>
    </aside>

    <main class="flex min-h-0 min-w-0 flex-1 flex-col bg-review-bg">
      <div id="code-view" class="scrollbar-thin min-h-0 flex-1"></div>
    </main>
  </div>
</div>

<script id="diff-review-data" type="application/json">__INLINE_DATA__</script>
<script id="diffs-worker-source" type="text/plain">__DIFFS_WORKER_JS__</script>
<script>__DIFFS_JS__</script>
<script type="module">
__INLINE_JS__
</script>
</body>
</html>

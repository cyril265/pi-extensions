<!DOCTYPE html>
<html lang="en" class="h-full bg-review-bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi annotate</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-review-bg: #0b1020;
    --color-review-panel: #111827;
    --color-review-hover: #1f2937;
    --color-review-border: #263244;
    --color-review-text: #e5e7eb;
    --color-review-strong: #f8fafc;
    --color-review-muted: #9ca3af;
    --color-review-accent: #60a5fa;
    --color-review-success: #34d399;
    --color-review-error: #fb7185;
  }
</style>
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; }
  .review-modal-backdrop {
    position: fixed; inset: 0;
    background: color-mix(in srgb, var(--color-review-bg, #010409) 86%, transparent);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .review-modal-card {
    width: min(760px, 92vw);
    background: var(--color-review-panel, #161b22);
    border: 1px solid var(--color-review-border, #30363d);
    border-radius: 12px;
    box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
    padding: 24px;
  }

  .md-block { position: relative; border-radius: 6px; padding: 2px 8px 2px 40px; margin-left: -40px; }
  .md-block:hover { background: color-mix(in srgb, var(--color-review-accent) 8%, transparent); }
  .md-block.has-comment { background: color-mix(in srgb, var(--color-review-accent) 12%, transparent); }
  .md-block-add {
    position: absolute; left: 8px; top: 2px;
    width: 22px; height: 22px;
    display: none; align-items: center; justify-content: center;
    border: none; border-radius: 5px; cursor: pointer;
    background: var(--color-review-success);
    color: #fff; font-size: 16px; font-weight: 700; line-height: 1;
  }
  .md-block:hover .md-block-add { display: flex; }

  .selection-comment-button {
    position: fixed; z-index: 50;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--color-review-border); border-radius: 6px;
    background: var(--color-review-success);
    color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .annotate-comment {
    margin: 6px 0 14px 0;
    padding: 10px 14px;
    border: 1px solid var(--color-review-border);
    border-radius: 8px;
    background: var(--color-review-panel);
  }

  .markdown-body { font-size: 15px; line-height: 1.65; color: var(--color-review-text); }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    color: var(--color-review-strong); font-weight: 600; margin: 0.9em 0 0.45em;
  }
  .markdown-body h1 { font-size: 1.7em; border-bottom: 1px solid var(--color-review-border); padding-bottom: 0.25em; }
  .markdown-body h2 { font-size: 1.4em; border-bottom: 1px solid var(--color-review-border); padding-bottom: 0.25em; }
  .markdown-body h3 { font-size: 1.2em; }
  .markdown-body p { margin: 0.5em 0; }
  .markdown-body ul, .markdown-body ol { margin: 0.5em 0; padding-left: 1.6em; }
  .markdown-body ul { list-style: disc; }
  .markdown-body ol { list-style: decimal; }
  .markdown-body li { margin: 0.2em 0; }
  .markdown-body a { color: var(--color-review-accent); text-decoration: underline; }
  .markdown-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em;
    background: var(--color-review-hover); border-radius: 4px; padding: 0.15em 0.35em;
  }
  .markdown-body pre {
    margin: 0.6em 0; padding: 12px 14px; overflow-x: auto;
    background: var(--color-review-panel);
    border: 1px solid var(--color-review-border); border-radius: 8px;
  }
  .markdown-body pre code { background: transparent; padding: 0; font-size: 0.88em; }
  .markdown-body blockquote {
    margin: 0.6em 0; padding: 0.1em 1em;
    border-left: 3px solid var(--color-review-border); color: var(--color-review-muted);
  }
  .markdown-body hr { margin: 1.2em 0; border: none; border-top: 1px solid var(--color-review-border); }
  .markdown-body table { border-collapse: collapse; margin: 0.6em 0; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--color-review-border); padding: 6px 12px; }
  .markdown-body th { color: var(--color-review-strong); background: var(--color-review-panel); }
</style>
</head>
<body class="h-full overflow-hidden bg-review-bg text-review-text antialiased">
<div class="flex h-full w-full flex-col">
  <div class="flex items-center justify-between gap-4 border-b border-review-border bg-review-bg px-4 py-3">
    <div class="min-w-0">
      <div id="window-title" class="text-[15px] font-semibold text-review-strong">Annotate turn</div>
      <div id="source-hint" class="truncate text-[11px] text-review-muted"></div>
    </div>
    <div class="flex items-center gap-2">
      <div id="summary" class="max-w-[24rem] truncate text-[11px] text-review-muted"></div>
      <button id="overall-comment-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Overall note</button>
      <button id="copy-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-hover">Copy text</button>
      <button id="cancel-button" class="cursor-pointer rounded-md border border-review-border bg-review-panel px-3 py-1.5 text-xs font-medium text-review-text hover:bg-review-error/10 hover:text-review-error hover:border-review-error/30">Cancel</button>
      <button id="submit-button" disabled class="cursor-pointer rounded-md border border-review-border bg-review-success px-3 py-1.5 text-xs font-medium text-white hover:opacity-90 disabled:cursor-default disabled:opacity-50">Finish annotation</button>
    </div>
  </div>
  <div class="min-h-0 flex-1 overflow-y-auto">
    <div id="markdown-content" class="markdown-body mx-auto max-w-4xl px-12 py-8"></div>
  </div>
</div>

</html>
